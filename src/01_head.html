<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLR Workbench v2</title>
<meta name="description" content="Offline-capable workbench for conducting and reporting systematic literature reviews.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0a14;
  --paper: #f5f3ee;
  --paper2: #eceae2;
  --paper3: #e4e0d6;
  --gold: #c8a96e;
  --gold-light: #e8d5b0;
  --gold-dim: #8a6f3f;
  --teal: #2a7f7f;
  --teal-light: #4fb3b3;
  --teal-dim: #1a5050;
  --coral: #d4604a;
  --coral-light: #e8957f;
  --coral-dim: #a8432f;
  --violet: #5a3e8a;
  --violet-light: #9b7fd4;
  --sage: #4a7a5a;
  --sage-light: #7db892;
  --amber: #b8860b;
  --border: rgba(10,10,20,0.10);
  --border-strong: rgba(10,10,20,0.22);
  --shadow: 0 2px 16px rgba(10,10,20,0.07);
  --shadow-lg: 0 8px 40px rgba(10,10,20,0.12);
  --font-display: 'Syne', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --font-body: 'DM Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.5}

/* ── HEADER ── */
.site-header{background:var(--ink);color:var(--paper);padding:0 1.5rem;display:flex;align-items:center;gap:14px;height:62px;position:sticky;top:0;z-index:200;border-bottom:2px solid var(--gold)}
.logo-group{display:flex;align-items:center;gap:12px;min-width:0}
.logo-badge{width:36px;height:36px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--ink);letter-spacing:-0.5px;flex-shrink:0}
.site-title{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.site-subtitle{font-size:10.5px;color:rgba(245,243,238,0.45);font-family:var(--font-mono);margin-top:1px;white-space:nowrap}
.header-actions{display:flex;gap:7px;align-items:center;margin-left:auto}
.save-chip{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;color:rgba(245,243,238,0.6);padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.07);white-space:nowrap}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--sage-light);flex-shrink:0;transition:background .2s}
.save-dot.dirty{background:var(--gold)}
.save-dot.error{background:var(--coral-light)}
.save-dot.saving{background:var(--teal-light);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:7px;font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:background .18s,transform .18s,box-shadow .18s;text-decoration:none;white-space:nowrap;color:var(--ink);background:var(--paper2)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:#d4b478;transform:translateY(-1px);box-shadow:0 4px 12px rgba(200,169,110,.35)}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--paper);border:1px solid rgba(255,255,255,.15)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}
.btn-ghost-ink{background:rgba(10,10,20,.04);color:var(--ink);border:1px solid var(--border-strong)}
.btn-ghost-ink:hover{background:rgba(10,10,20,.09)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-dim);transform:translateY(-1px)}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover{background:var(--coral-dim);transform:translateY(-1px)}
.btn-sage{background:var(--sage);color:#fff}
.btn-sage:hover{background:#3a6248;transform:translateY(-1px)}
.btn-violet{background:var(--violet);color:#fff}
.btn-violet:hover{background:#472f6e;transform:translateY(-1px)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px}
.btn-lg{padding:11px 22px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── TABS ── */
.tab-bar{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 1.5rem;position:sticky;top:62px;z-index:100;overflow-x:auto;scrollbar-width:thin}
.tab{padding:13px 15px;font-size:12.5px;font-weight:500;color:rgba(10,10,20,.45);cursor:pointer;border-bottom:2.5px solid transparent;transition:color .18s,border-color .18s;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;user-select:none}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.tab-count{background:var(--paper2);color:rgba(10,10,20,.5);font-size:10px;font-family:var(--font-mono);padding:1px 6px;border-radius:10px;font-weight:600}
.tab.active .tab-count{background:rgba(42,127,127,.12);color:var(--teal)}
.tab-count.alert{background:rgba(212,96,74,.15);color:var(--coral-dim)}

/* ── LAYOUT ── */
.main{max-width:1480px;margin:0 auto;padding:1.6rem 1.5rem 5rem}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeUp .26s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-header{display:flex;align-items:baseline;gap:12px;margin-bottom:1.3rem;flex-wrap:wrap}
.section-title{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.5px}
.section-tag{font-family:var(--font-mono);font-size:10.5px;background:var(--gold-light);color:var(--gold-dim);padding:3px 8px;border-radius:4px;font-weight:500}
.section-desc{font-size:12.5px;color:rgba(10,10,20,.45);margin-left:auto;max-width:52ch;text-align:right}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}

/* ── CARDS ── */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:13px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-family:var(--font-display);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card-body{padding:17px}
.card-body.tight{padding:0}
.card-note{font-size:12px;color:rgba(10,10,20,.5);margin-top:4px;line-height:1.55}

/* ── FORMS ── */
label.fl{display:block;font-size:11.5px;font-weight:600;color:rgba(10,10,20,.6);margin-bottom:5px;letter-spacing:.2px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--border-strong);border-radius:7px;font-family:var(--font-body);font-size:13px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(42,127,127,.12)}
textarea{resize:vertical;min-height:70px;line-height:1.55}
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.inline-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline-fields>*{flex:1 1 150px;min-width:0}
input[type=checkbox],input[type=radio]{width:15px;height:15px;accent-color:var(--teal);cursor:pointer;flex-shrink:0}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;user-select:none}
.hint{font-size:11.5px;color:rgba(10,10,20,.45);margin-top:4px;line-height:1.5}

/* ── TABLES ── */
.table-wrap{overflow:auto;position:relative}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--paper2);z-index:2;text-align:left;padding:9px 11px;font-weight:600;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:rgba(10,10,20,.55);border-bottom:1px solid var(--border-strong);white-space:nowrap}
tbody td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:rgba(200,169,110,.06)}
tbody tr.is-dup{background:rgba(212,96,74,.055)}
tbody tr.is-dup:hover{background:rgba(212,96,74,.1)}
tbody tr.spacer:hover{background:none}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.t-title{font-weight:500;line-height:1.45;max-width:48ch}
.t-meta{font-size:11px;color:rgba(10,10,20,.5);margin-top:2px;font-family:var(--font-mono)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;font-family:var(--font-mono);white-space:nowrap;letter-spacing:.2px}
.b-include{background:rgba(74,122,90,.15);color:var(--sage)}
.b-exclude{background:rgba(212,96,74,.15);color:var(--coral-dim)}
.b-maybe{background:rgba(184,134,11,.16);color:var(--amber)}
.b-pending{background:var(--paper3);color:rgba(10,10,20,.45)}
.b-conflict{background:rgba(90,62,138,.15);color:var(--violet)}
.b-dup{background:rgba(212,96,74,.15);color:var(--coral-dim)}
.b-teal{background:rgba(42,127,127,.13);color:var(--teal)}
.b-gold{background:var(--gold-light);color:var(--gold-dim)}

/* ── STATS ── */
.stat{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.stat-label{font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:rgba(10,10,20,.45)}
.stat-value{font-family:var(--font-display);font-size:27px;font-weight:700;letter-spacing:-1px;margin-top:3px;line-height:1.1}
.stat-sub{font-size:11.5px;color:rgba(10,10,20,.5);margin-top:2px;font-family:var(--font-mono)}
.stat.accent-teal .stat-value{color:var(--teal)}
.stat.accent-coral .stat-value{color:var(--coral)}
.stat.accent-sage .stat-value{color:var(--sage)}
.stat.accent-violet .stat-value{color:var(--violet)}
.stat.accent-gold .stat-value{color:var(--gold-dim)}

/* ── PROGRESS ── */
.progress-bar{height:8px;background:var(--paper3);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-light));border-radius:20px;transition:width .25s ease}
.progress-fill.gold{background:linear-gradient(90deg,var(--gold-dim),var(--gold))}

/* ── DROPZONE ── */
.dropzone{border:2px dashed var(--border-strong);border-radius:12px;padding:34px 20px;text-align:center;background:rgba(255,255,255,.55);transition:border-color .18s,background .18s;cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--teal);background:rgba(42,127,127,.05)}
.dropzone-icon{font-size:30px;margin-bottom:8px;opacity:.7}

/* ── MODAL ── */
.modal-back{position:fixed;inset:0;background:rgba(10,10,20,.55);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;backdrop-filter:blur(2px)}
.modal-back.open{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;animation:fadeUp .2s ease}
.modal.wide{max-width:860px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:16px}
.modal-body{padding:20px;overflow:auto}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{background:none;border:none;font-size:20px;cursor:pointer;color:rgba(10,10,20,.4);line-height:1;padding:2px 6px;border-radius:5px}
.x-btn:hover{background:var(--paper2);color:var(--ink)}

/* ── TOAST ── */
#toastHost{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:9px;font-size:13px;box-shadow:var(--shadow-lg);animation:fadeUp .2s ease;max-width:min(92vw,520px)}
.toast.err{background:var(--coral-dim)}
.toast.ok{background:var(--sage)}

/* ── MISC ── */
.empty{text-align:center;padding:42px 20px;color:rgba(10,10,20,.4)}
.empty-icon{font-size:34px;margin-bottom:10px;opacity:.5}
.empty-title{font-family:var(--font-display);font-weight:700;font-size:15px;color:rgba(10,10,20,.6);margin-bottom:4px}
.divider{height:1px;background:var(--border);margin:16px 0}
.mono{font-family:var(--font-mono)}
.muted{color:rgba(10,10,20,.5)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.rev-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--font-mono);padding:3px 9px;border-radius:20px;background:var(--paper2);border:1px solid var(--border)}
.rev-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.callout{border-left:3px solid var(--teal);background:rgba(42,127,127,.06);padding:11px 14px;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.6}
.callout.warn{border-left-color:var(--coral);background:rgba(212,96,74,.06)}
.callout.gold{border-left-color:var(--gold);background:rgba(200,169,110,.09)}
.scroll-y{overflow-y:auto}
.chart-host svg{display:block;width:100%;height:auto}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--paper2);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
#diagramWrap{background:#fff;padding:16px;border-radius:10px;overflow:auto}
#diagramWrap svg{display:block;margin:0 auto;max-width:100%;height:auto}
@media (max-width:680px){
  .main{padding:1.2rem 1rem 4rem}
  .site-header{padding:0 1rem}
  .tab-bar{padding:0 1rem}
  .section-desc{margin-left:0;text-align:left}
  .site-subtitle{display:none}
}
@media print{
  .site-header,.tab-bar,.btn,.header-actions{display:none!important}
  .tab-panel{display:block!important}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
